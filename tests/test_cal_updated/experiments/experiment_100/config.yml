pattern_exploiting_training:
  pattern: 'Das Mass an Sensationalismus in diesem Satz ist <mask>: <TEXT>'
  verbalizer:
    neutral: gering
    sensationalistisch: hoch

parameter_efficient_fine_tuning:
  architecture: lora
  c_rate: 16
  r: 8
  alpha: 8
  prefix_len: 30

active_learning:
  strategy: random
  start_dataset_fraction: 0.15
  query_size_fraction: 0.15
  al_iteration_number: 0

continual_learning:
  method: sds2
  alpha: 0.5
  beta: 1.0
  replay_size_fraction: 0.02
  kernel_width: 1
  l: 1
  c_fraction: 0.05

training:
  model: xlm-roberta-large
  learning_rate: 1.0e-04
  num_train_epochs: 2
  per_device_train_batch_size: 1
  run_number: 1
  output_dir: output


