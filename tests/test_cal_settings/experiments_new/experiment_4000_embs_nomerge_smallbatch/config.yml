data:
  api_key_file: api_key.txt
  output_dir: output
  emb_dir: embeddings

pattern_exploiting_training:
  pattern: 'Das Mass an Sensationalismus in diesem Satz ist <mask>: <TEXT>'
  verbalizer:
    neutral: gering
    sensationalistisch: hoch

parameter_efficient_fine_tuning:
  architecture: lora
  c_rate: 16
  r: 8
  alpha: 8
  prefix_len: 30

active_learning:
  strategy: uncertainty
  start_dataset_fraction: 0.025 # 100
  query_size_fraction: 0.005 # 20
  al_iteration_number: 10

continual_learning:
  method: sds2
  alpha: 0.5
  beta: 1.0
  replay_size: 25
  kernel_width: 1
  l: 1
  c: 50

training:
  model: xlm-roberta-large
  learning_rate: 1.0e-04
  num_train_epochs: 15
  per_device_train_batch_size: 4
  run_number: 4


