pattern_exploiting_training:
  pattern: '<mask> News: <TEXT>'
  verbalizer:
    world: World
    sports: Sports
    business: Business
    sci_tech: Tech

parameter_efficient_fine_tuning:
  architecture: adapter
  c_rate: 8
  r: 0
  alpha: 0
  prefix_len: 0

active_learning:
  strategy: random
  start_dataset_fraction: 1.0
  query_size_fraction: 0
  al_iteration_number: 0

continual_learning:
  method: none
  alpha: 0
  beta: 0
  replay_size_fraction: 0
  kernel_width: 0
  l: 0
  c_fraction: 0

training:
  model: xlm-roberta-large
  learning_rate: 0.0001
  num_train_epochs: 15
  per_device_train_batch_size: 20
  run_number: 3
  output_dir: output
