pattern_exploiting_training:
  pattern: 'Question about <mask>: <TEXT>'
  verbalizer:
    abbr: abbreviation
    enty: entity
    desc: concept
    hum: human
    loc: location
    num: number

parameter_efficient_fine_tuning:
  architecture: adapter
  c_rate: 8
  r: 0
  alpha: 0
  prefix_len: 0

active_learning:
  strategy: coreset
  start_dataset_fraction: 0.01
  query_size_fraction: 0.01
  al_iteration_number: 9

continual_learning:
  method: none
  alpha: 0
  beta: 0
  replay_size_fraction: 0
  kernel_width: 0
  l: 0
  c_fraction: 0

training:
  model: xlm-roberta-large
  learning_rate: 0.0001
  num_train_epochs: 15
  per_device_train_batch_size: 10
  run_number: 3
  output_dir: output
